","basis":"source-name"}]},"59d8f486ff700700aed3b769":{"sourceDate":"2024-12-04","orderSHA256":"9b9f693727a0536d53d28e66690ecaff5fe8497a15182b7c8f3f3df2b4e0cfe1","groups":[{"label":"Drums + Bass","description":"Congo phrases on 1–3 and a bass note on 4. Build a pulse, then add the low sound.","basis":"source-name"},{"label":"Bass + Melody","description":"Bass on 5–6, melody on 7–8. Trade a low sound for a brighter answer.","basis":"source-name"},{"label":"Melody + Textures","description":"Melody on 9–10, effects on 11–12. Keep the tune moving and add a surprise.","basis":"source-name"},{"label":"Textures + Synth","description":"An effect on 13 and synth tones on 14–15. Sound 16 is empty.","basis":"source-name"}]},"59dc952a6d692600ae8bc719":{"sourceDate":"2024-12-04","orderSHA256":"0d89f23a1ebe62cc8b1c0da28ff7d8bc0bd3f2401b8c75119dcba84f0b00c80f","groups":[{"label":"Deep resonance","description":"Long recordings with the strongest low tones in this pack. Leave space for each sound to unfold.","basis":"waveform-character"},{"label":"Mixed resonance","description":"Four long sounds that move between deeper and brighter colour. Try two together.","basis":"waveform-character"},{"label":"Bright resonance","description":"Four brighter, ringing recordings. Add one above the deeper first group.","basis":"waveform-character"},{"label":"Final resonance","description":"One ringing recording on 13. Sounds 14–16 are empty; return to the first groups to answer it.","basis":"waveform-character"}]},"59dc9ed46d692600ae8bc71a":{"sourceDate":"2024-12-04","orderSHA256":"a754a8887c4a9079f066084983f082582269db80af96279411c14d38f2ab0713","groups":[{"label":"Kalimba","description":"The lowest four kalimba notes. Start a gentle melody here.","basis":"source-name"},{"label":"Kalimba","description":"Four higher kalimba notes. Answer a note from the first group.","basis":"source-name"},{"label":"Kalimba","description":"Four brighter kalimba notes. Move between this group and the lower notes.","basis":"source-name"},{"label":"Kalimba","description":"The highest four kalimba notes. Add a light finishing note to your phrase.","basis":"source-name"}]},"59dca7706d692600ae8bc71b":{"sourceDate":"2024-12-04","orderSHA256":"172c3a0fdf643952c1689e55c3a287519e553df96eaf14f05c75138b2f2cdbec","groups":[{"label":"Opening phrases","description":"Four recordings of different lengths. Play one, let it unfold, then answer with another.","basis":"source-name"},{"label":"Long + short","description":"Sound 5 lasts about 27 seconds; 6–8 are shorter. Let the long phrase sit behind a brief reply.","basis":"waveform-character"},{"label":"Contrasting phrases","description":"Sound 10 is the longest in this group. Alternate its extended phrase with the shorter neighbours.","basis":"waveform-character"},{"label":"Closing phrases","description":"Three longer recordings on 13–15. Give them room to unfold; sound 16 is empty.","basis":"source-name"}]},"59e9e80af5803000b03705aa":{"sourceDate":"2024-12-04","orderSHA256":"00bdec2c440433a58c43ce3be41629d6586ef3873a64a306bbcd119e8167992d","groups":[{"label":"Rhythm","description":"A deep first sound followed by brighter sounds. Try a repeating 1–2 pulse and add 3 or 4.","basis":"waveform-character"},{"label":"Low tones","description":"Four low, focused tones. Use one at a time underneath the brighter groups.","basis":"waveform-character"},{"label":"Mid tones","description":"Four tones in the middle of the pack. Try a short melody over a low sound.","basis":"waveform-character"},{"label":"Low + bright","description":"Two deeper tones followed by two brighter ones. Answer low with high.","basis":"waveform-character"}]},"59e9ea6c08f07b00b0be6b93":{"sourceDate":"2024-12-04","orderSHA256":"508a7c69facc5bf5f7d9e12df0dce5deb6910ae3e6e8e034d039dcec2a0fa2fb","groups":[{"label":"Rhythm","description":"A deep first hit and three brighter sounds. Build a pulse with 1 and 2, then add detail.","basis":"waveform-character"},{"label":"Low tones","description":"Four closely related low tones. Change the foundation by switching between them.","basis":"waveform-character"},{"label":"Middle colour","description":"Four darker middle tones. Try two together, then answer with the brighter last group.","basis":"waveform-character"},{"label":"Bright colour","description":"Four brighter recordings. Add a short answer above the low tones.","basis":"waveform-character"}]},"59e9eb1808f07b00b0be6b94":{"sourceDate":"2024-12-04","orderSHA256":"8b61435589717cffddde24f80ae2161229477f1a31bd24abde812954052bb3d4","groups":[{"label":"Rhythm","description":"A low first hit and three contrasting bright sounds. Start with a sparse repeating pattern.","basis":"waveform-character"},{"label":"Low tones","description":"Four low tones with different colours. Choose a foundation and change it between phrases.","basis":"waveform-character"},{"label":"Tonal layers","description":"Four closely related middle tones. Try pairs to find a combination you like.","basis":"waveform-character"},{"label":"Bright accents","description":"Three middle-to-bright sounds and a much brighter final sound. Use 16 as a finishing accent.","basis":"waveform-character"}]},"59e9ebc008f07b00b0be6b95":{"sourceDate":"2024-12-04","orderSHA256":"29061da90e0bb7593ba8f46f0f4efc8fa7ffc3ec01c4a8bf985e7ee1fb0dc0e7","groups":[{"label":"Bright layers","description":"Four recordings with a similar bright character. Try them separately to hear the differences.","basis":"waveform-character"},{"label":"Low tones","description":"Four focused low tones. Use them underneath the bright first group.","basis":"waveform-character"},{"label":"Bright replies","description":"Another set of bright recordings. Answer a sound from 1–4 with one from this group.","basis":"waveform-character"},{"label":"Bright variations","description":"Four more bright recordings in the original order. Swap one into a phrase to change its colour.","basis":"waveform-character"}]},"59e9ecc308f07b00b0be6b96":{"sourceDate":"2 waveform-character"}]},"59e9feb635726800b005f0bc":{"sourceDate":"2024-12-04","orderSHA256":"6b00e9339fddd14a4016e126ad12218a896868080b8c26c2b1fb42b16a13f213","groups":[{"label":"Rhythm","description":"Two deeper sounds followed by two brighter ones. Make a pulse with a light answering sound.","basis":"waveform-character"},{"label":"Low tones","description":"Four low, focused recordings. Use them as a foundation for the next group.","basis":"waveform-character"},{"label":"Middle tones","description":"Four darker middle tones. Try a slow phrase or a pair of sounds.","basis":"waveform-character"},{"label":"Middle replies","description":"Four recordings with a little more brightness. Answer the third group and leave room between sounds.","basis":"waveform-character"}]},"59ea00ea35726800b005f0bd":{"sourceDate":"2024-12-04","orderSHA256":"3cef5e31bbc16a9c2ec1bb2810db8c7a289e6c806d67ee187678770ac6772ffc","groups":[{"label":"Rhythm","description":"One deep sound and three brighter sounds. Build a simple repeating pattern.","basis":"waveform-character"},{"label":"Deep tones","description":"Four very low tones. Use one underneath the brighter recordings.","basis":"waveform-character"},{"label":"Dark layers","description":"Four darker middle tones with similar colour. Try pairs above a deep tone.","basis":"waveform-character"},{"label":"Tonal replies","description":"A darker first recording and three brighter ones. Answer low with high.","basis":"waveform-character"}]},"59ea03a235726800b005f0be":{"sourceDate":"2024-12-04","orderSHA256":"dc16c2c6f9f3b3dd662f13b85b7185cc91b10bb2f7a6d6ce19b039f9dbf3e26a","groups":[{"label":"Keys","description":"Four piano recordings to begin a phrase. Try one at a time, then a pair.","basis":"source-name"},{"label":"Keys","description":"Another four piano tones. Answer the first group with a different combination.","basis":"source-name"},{"label":"Keys","description":"Four brighter piano recordings. Add one above a phrase from the first groups.", on:`Compare Wood, Glass and Soft using the buttons below. Leave your preferred sound selected and add a note.`,expected:`The same phrase plays on three new sounds. Yes means the selected option suits this first prototype.`,kind:`sound`},{id:`T08`,title:`Connect Playtron`,instruction:`Connect Playtron by USB. Allow the browser MIDI permission if asked. Its name should appear in the device menu immediately. With several devices, choose Playtron there.`,expected:`The device menu shows the selected Playtron; no repeated connection label is required. Touch a contact to play; if the browser asks for audio interaction, click once anywhere in the instrument. Without the device, choose Skip; the report records NOT_RUN.`,kind:`midi-connect`},{id:`T09`,title:`Physical contact`,instruction:`Hold Ground metal and touch a clipped object, then release it. To change assignments, open the board-picture Help & settings button → Settings → Assign sounds. Choose a sound number in the temporary row, then touch Playtron or click a fixed contact on the picture. The selected sound is saved and auditioned. Done returns to playing; A / W work on the keyboard.`,expected:`You hear sound and see the form respond and fade. Tick the physical Playtron declaration below. Virtual MIDI does not establish USB compatibility.`,kind:`physical`},{id:`T10`,title:`Stop and restart`,instruction:`Click Run: the prototype will stop audio, release its MIDI input and restart audio. Then press A.`,expected:`No voices remain after stopping. You can play after restarting. Physical MIDI reconnection is reviewed separately.`,kind:`recovery`},{id:`T11`,title:`Automatic original packs`,kind:`pack`,instruction:`Choose an original sound pack in the instrument. It prepares automatically; then press a key or touch a pad.`,expected:`The selected pack loads with progress, without Start or library selection. The selector lists 30 production packs, 13 historical definitions and five static packs.`},{id:`T12`,title:`Original pack sound approval`,kind:`pack`,instruction:`Choose an original pack in the instrument, play several contacts, then press the same contact twice. Return here. Add its name, balance, clipping and loop-seam notes. Repeat and copy this step for each pack you review.`,expected:`Mapped samples play at their original pitch. Ordinary sounds start again on a new press. Source loops, including NOTKIN 1–4 and Space where defined, start on the first press and stop on the second. Stopping one loop leaves the others playing. Empty contacts stay empty. One historical HOP mapping is visibly unavailable. Your selected pack and software state are saved with the answer.`},{id:`T13`,title:`Space loop`,kind:`space`,instruction:`Click Run to load original KALIMBA. Press and release Space: its loop should keep playing. Press Space again to stop it.`,expected:`The Space pad turns green while looping. A second press, the square Stop button or a pack change stops it. Some other packs have a Space one-shot or no Space sample.`},{id:`T14`,title:`Chillax forms`,kind:`visual`,scene:`chillax`,instruction:`Click Run, then play A W S E D F T G Y H U J K O L P. Review the blue kick, dots, green waves, ovals and triangle strips.`,expected:`Shapes use the recovered Chillax geometry. Random positions are fixed for repeatable review. Note any differences from the old website.`},{id:`T15`,title:`Mute and restart`,kind:`manual`,instruction:`Set Volume to zero. Choose Options → Use device in another app, then play a pad or run First sound in Guided review. It must stay silent. Restore your volume afterward.`,expected:`A new engine and guide obey the same volume; record whether you heard unexpected audio.`},{id:`T16`,title:`Keyboard octaves`,kind:`manual`,instruction:`Use Z / X to change pad pitch. For a MIDI keyboard, use the MIDI octave buttons. Send a note outside its displayed range.`,expected:`Pitch and input bank are separate; Space loops retain tempo. An unmapped note shows its number/channel and a next action.`},{id:`T17`,title:`Settings preset`,kind:`manual`,instruction:`Open the board-picture Help & settings button → Settings → Pad notes & presets. Select Settings default, save a preset, then load that file. Verify notes 60–75 and channel 1. Do not send to hardware for this check.`,expected:`Official preset format round-trips. Loading/editing never writes the device; physical device settings remain unverified.`},{id:`T19`,title:`Phone / tablet`,kind:`manual`,instruction:`On your iPhone or iPad, open the hosted player in portrait: a brief rotation hint should appear once. Turn to landscape. Touch two vertical strips together, then slide one finger sideways and release both. Rotate while holding a contact, then touch again. Try a browser-bar height change and iPad split view. Use the striped icon to turn the touch surface off and on. Keep playing for ten seconds: labels retreat, while Volume, the square Stop and picture-led help remain available. Try them. Open the gear and return to playing. Without browser device support, confirm the install guide appears after the rotation cue. Follow its Get MIDIWeb Browser and Copy page link steps, then connect Playtron in the app and allow device access if asked.`,expected:`Sound and forms follow each finger without page scrolling or stuck notes. All 16 sounds and Space remain available in both orientations. The hint never blocks playing or repeats. Landscape fills the screen; controls and panels avoid notches. Rotation releases held touches; a height-only change keeps the chord. Controls fit; musical touch can stay immersed and deliberate visible recovery reaches Stop, Volume and help. Record device, OS, browser/app version, pack and any interruption. Desktop emulation cannot pass this physical step.`},{id:`T18`,title:`Sade forms`,kind:`visual`,scene:`sade`,instruction:`Run the original static Sade pack. Review circles, waves and fields. Play slowly, then faster; try Movement, Size, Flow and Fade in Options.`,expected:`Sade preserves its source bass weight. Movement builds and settles smoothly with note density. Reset visuals restores Auto 50% and the original size, flow and fade; sound is unchanged.`},{id:`T20`,title:`Immediate response`,kind:`keyboard`,instruction:`Choose a short percussive sound, then play quick taps and a chord on Playtron, the keyboard or the screen. Try with your usual speaker or headphones. In your note, name the device, browser and whether the output is built-in, wired or Bluetooth. Does sound feel immediate?`,expected:`No extra delay, missed hit or crackle during normal play. Exported timing separates ready-note scheduling from loading/resume and browser output estimates. Your answer is a listening check, not a measured physical millisecond result.`},{id:`T21`,title:`Four sound groups and contact view`,kind:`manual`,instruction:`Choose a few packs and tap each coloured group heading. Does its description help you play? Choose BANANA-O or the original static Chillax pack. Play each block of four sounds. Connect Playtron and compare the paired holes on the drawing with your board. Touch two contacts together, then release them and press A / W on the computer keyboard. Click a sound/contact and glide with held mouse to play. Open Help & settings → Settings → Assign sounds once; choose a sound in its temporary row with a thin outline and small marker. Touch Playtron or click a fixed contact on the picture. Select another sound number directly and choose its destination. Choose Done and check the view again. Add the exact device revision and any position or label mismatch.`,expected:`Four colours preserve the source order. Supported family labels match the samples. The KiCad Pythagoras A reference keeps pad proportions and lights contacts on touch; keyboard playing shows physical key positions. Only the selected outlined sound takes the next contact; ordinary playing never changes assignments. Assignment stays available between numbers; releases and other messages do not assign. Assignment changes the number and family color at a fixed contact; copper and holes never move. Unknown hardware note addresses use a sound grid. Other firmware wiring needs a physical check; the illustration does not identify a revision.`},{id:`T22`,title:`Expressive effects`,kind:`manual`,instruction:`Open the effects icon beside Volume. Play a short sound, then turn Delay and Reverb up one at a time. Move Tone down for Warm and up for Bright; check Original at the centre while holding a sound. Try a chord with all three up. Choose Original sound to reset. Increase Delay/Reverb again, release the notes and press the square Stop button beside Volume. Note the pack, browser, speaker/headphones, useful settings and any crackle or excessive level.`,expected:`Delay adds echoes; Reverb adds a room tail; Tone gently warms or brightens the sound without muting it; its centre is Original. Mouse/touch drag and keyboard arrows work. The original attack stays immediate with Delay/Reverb, volume zero mutes both direct sound and tails, Stop clears tails, and reset restores the original sound. Effect amounts are copied with your result. This does not approve physical latency or sound quality automatically.`},{id:`T23`,title:`Clips, Ground and first play`,kind:`manual`,instruction:`Give a first-time user the player before explaining it. Open the board-picture Help & settings button. Ask them to connect a sound contact to an object using crocodile clips, hold the exposed metal jaw end of the Ground clip against bare skin with their right hand, and touch/release the object with their other hand. Confirm hearing separately. Try a loose clip or muted output and use No sound? → Check & copy report. Find contact assignment and device settings in the same hub. Disconnect/reconnect; compare available older and USB-C units, and record actual phone/iPad/MIDIWeb results separately. Note the exact browser/app, unit, pack, wrong actions, hesitation and intervention.`,expected:`The circuit is understood from pictures and observed actions. Direct PCB fingers are only an optional short diagnostic. Fresh selected-device touches and sound starts are separate from hearing and Ground use. Closing help leaves playing available; returning preserves choices. Older units still play and assign; hardware memory requires explicit capability checking and Send. Do not send without physical approval. Check touch-only and keyboard access to Stop, Volume and help during immersion; untested outcomes remain NOT_RUN.`},{id:`T24`,title:`MIDIWeb offline return`,kind:`manual`,instruction:`On an actual iPhone or iPad, record the MIDIWeb Browser version and exact hosted player URL. Online, choose JAZZY and use Options → Offline & updates → Save this pack. If the app offers its own offline feature, use it and record its actual wording. Quit the app, disconnect internet and reopen the saved page. Use an ordinary page gesture if sound access needs one; play all contacts and Space. Try a pack you never prepared, then return to JAZZY. Reconnect online and check an explicit update.`,expected:`Record shell reopening, saved samples, MIDI receipt, sound starts and hearing separately. A missing pack gives an online/retry action without losing saved sounds or claiming Ready. An update preserves verified sounds and does not surprise other tabs. App version 2.0.6 advertises offline sites; dynamic sample preservation and physical playback remain unverified until this real-device step. Skip if no real device or approved HTTPS deployment is available; desktop WebKit cannot pass it.`}];function G(e,t,n=new Date().toISOString()){return{schema:`playtron-guided-review-v1`,build:e,startedAt:n,reviewer:``,userAgent:t,records:[]}}function Oe(e,t){if(!W.some(e=>e.id===t.id))throw Error(`Unknown step`);let n={...t,note:t.note.slice(0,2e3)};return t.id===`T09`&&t.human===`PASS`&&!t.physicalUserDeclaration&&(n.human=`NOT_RUN`),{...e,records:[...e.records.filter(e=>e.id!==t.id),n].sort((
